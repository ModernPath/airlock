# This user's global config: ~/.config/airlock/airlock.toml (default
# location; $XDG_CONFIG_HOME/airlock/airlock.toml if set). Applies to every
# project on this machine, not just acme/app. Needs no approval — it's the
# user's own file, outside every project.

[secrets.GH_TOKEN]
source  = "command"
command = ["op", "read", "op://Private/GitHub/token"]

# A tool this user wants everywhere, independent of any one repo's config.
[tools.aws]
description = "AWS CLI"

[tools.aws.env]
AWS_PROFILE = "personal"

[agent]
passthrough_env = ["COLORTERM"]
