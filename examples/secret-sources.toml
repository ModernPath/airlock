# Secret sources — reference for `[secrets.<label>]`, not a config to run
# as-is. Copy the block for your source into your own airlock.toml, or
# airlock.local.toml for a personal binding (see the README's "Team and
# personal config"). The five labels below are independent examples, not
# meant to be used together.

# ─── `source = "env"`: pipe a secret in, don't type it ─────────────────────
#
# This reads GH_TOKEN from `airlock run`'s own environment, so keep it out of
# your shell history and out of a plain `export` a sibling process could read
# with `ps eww`:
#
#   GH_TOKEN="op://Employee/GH_TOKEN/credential" op run -- airlock run --profile claude
#   secretspec run -- airlock run --profile claude
#   GH_TOKEN=$(vault kv get -field=token secret/github) airlock run --profile claude
[secrets.GH_TOKEN]
source = "env"

# ─── 1Password CLI ──────────────────────────────────────────────────────────
#
# Lets `airlock run` fetch the value itself — no `op run` wrapper needed.
# Requires `op` on your PATH and `eval $(op signin)` (or biometric unlock).
[secrets.cloudflare_token]
source  = "command"
command = ["op", "read", "op://Infrastructure/Cloudflare/api_token"]
timeout = 10

# ─── HashiCorp Vault ─────────────────────────────────────────────────────────
#
# Requires `vault login` beforehand; the command inherits your Vault token
# the way any shell command would.
[secrets.vault_github_token]
source  = "command"
command = ["vault", "kv", "get", "-field=token", "secret/github"]
timeout = 10

# ─── `gh auth token` — reuse your own GitHub CLI login ──────────────────────
#
# No separate credential to manage: whatever `gh auth login` set up locally
# is what the sandboxed `gh` gets, scoped to your account.
[secrets.gh_cli_token]
source  = "command"
command = ["gh", "auth", "token"]
timeout = 10

# ─── gcloud — mint a short-lived, impersonated access token ────────────────
#
# See examples/gcp-impersonation.toml for the IAM setup this needs, and the
# README's "Minting scoped credentials" for why this is the preferred
# pattern over a long-lived key. `refresh` keeps the token from expiring
# mid-session.
[secrets.gcp_access_token]
source  = "command"
command = [
  "gcloud", "auth", "print-access-token",
  "--impersonate-service-account=agent-readonly@my-project.iam.gserviceaccount.com",
]
timeout = 30
refresh = 3000
refresh_max_backoff = 600
