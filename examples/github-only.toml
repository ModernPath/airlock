# Minimal setup: GitHub CLI only
#
# Use it:
#   cp examples/github-only.toml airlock.toml
#   airlock run --profile claude        # asks you to trust the file the first time
#
# Inside the agent:
#   airlock exec -- gh repo list
#   airlock exec -- gh pr create --title "fix: typo" --body "Fixed a typo"
#   airlock exec -- gh issue list --label bug

# The sandbox root (the directory containing this file) is always read-write,
# and a baseline of system paths (/usr/lib, /etc, /dev/{null,random,urandom},
# ...) is always readable. Use [filesystem] only for paths beyond that.
[filesystem]
write = ["/tmp"]

# `from` is optional — it defaults to the label, so [secrets.GH_TOKEN] reads
# the GH_TOKEN env var. Supply it with `GH_TOKEN=... airlock run` or, better,
# `op run -- airlock run` (see examples/secret-sources.toml).
[secrets.GH_TOKEN]
source = "env"

[tools.gh]
description = "GitHub CLI"
timeout = 60

# `{tool_state}` expands to a per-project, per-tool directory under
# $XDG_CACHE_HOME/airlock, outside the project and outside the agent's own
# sandbox, so each checkout gets its own gh config instead of sharing
# `~/.config/gh`. Drop the env line (and add `extra_read = ["~/.config/gh"]`)
# to use your global gh auth instead.
[tools.gh.env]
GH_TOKEN = { secret = "GH_TOKEN" }
GH_CONFIG_DIR = "{tool_state}"
