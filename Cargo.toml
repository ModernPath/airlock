[package]
name = "airlock"
version = "1.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "io-std", "macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
libc = "0.2"
rustix = { version = "1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
aho-corasick = "1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
percent-encoding = "2"
zeroize = "1"
leon = "3"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
