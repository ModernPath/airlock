[package]
name = "airlock"
version = "1.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "io-std", "macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
libc = "0.2"
rustix = { version = "1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
aho-corasick = "1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
percent-encoding = "2"
zeroize = "1"
leon = "3"
# Proxy-tool runtime. One rustls crypto provider (ring) is selected explicitly
# here and installed by name at CA construction, so nothing depends on
# process-default provider auto-detection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
webpki-roots = "1"
time = "0.3"
getrandom = "0.3"
subtle = "2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
